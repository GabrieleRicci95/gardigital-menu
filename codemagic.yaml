workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Apple Build"
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.gardigital.menu"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          # 1. Generate a new private key locally
          openssl genrsa -out /tmp/cert_key.p8 2048
          # 2. Unified command to Create Certificate + Create Profile + Save to Keychain
          app-store-connect fetch-signing-files --type IOS_APP_STORE --create --certificate-key "@file:/tmp/cert_key.p8" "$BUNDLE_ID"
          # 3. LINK the profiles and save the plist to the root
          xcode-project use-profiles
          cp /Users/builder/export_options.plist ./export_options.plist
          # 4. DISCOVERY: See how to pass variables to build
          xcode-project build-ipa --help
      - name: Install dependencies
        script: |
          npm install
      - name: Capacitor build
        script: |
          npm run build
          npx cap sync ios
      - name: Build iOS App
        script: |
          # 1. Extract the hidden UUID
          PROFILE_UUID=$(grep -a -A1 "UUID" /Users/builder/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision | grep string | sed 's/<[^>]*>//g' | xargs | head -n 1)
          echo "Using Profile UUID: $PROFILE_UUID"
          
          # 2. RAW ARCHIVE: Direct call to xcodebuild to avoid wrapper interference
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath $(pwd)/build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            PROVISIONING_PROFILE=$PROFILE_UUID \
            DEVELOPMENT_TEAM=33VT7NT5X9 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual
          
          # 3. RAW EXPORT: Create the IPA from the archive
          xcodebuild -exportArchive \
            -archivePath $(pwd)/build/ios/xcarchive/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath $(pwd)/build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - gabricci95@gmail.com # The user's email from GitHub
        notify:
          success: true
          failure: true
