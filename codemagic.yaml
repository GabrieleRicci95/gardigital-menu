workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - apple_auth
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_ID: "com.gardigital.menu"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Verify Environment
        script: |
          echo "Checking if Apple variables are set (names only):"
          env | grep APP_STORE_CONNECT | cut -d= -f1
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Debug signing (List profiles)
        script: |
          ls -R ~/Library/MobileDevice/Provisioning\ Profiles || echo "No profiles found"
      - name: Build iOS App
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-method app-store
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - gabricci95@gmail.com # The user's email from GitHub
        notify:
          success: true
          failure: true
