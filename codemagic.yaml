workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Apple Build"
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.gardigital.menu"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          # 1. Generate a new private key locally
          openssl genrsa -out /tmp/cert_key.p8 2048
          # 2. Create the Distribution Certificate using this key (note the @file: prefix)
          app-store-connect certificates create --type IOS_DISTRIBUTION --certificate-key "@file:/tmp/cert_key.p8" --save
          # 3. Create/Fetch the profile (bundle ID at the end as positional argument)
          app-store-connect fetch-signing-files --type IOS_APP_STORE --create "$BUNDLE_ID"
      - name: Install dependencies
        script: |
          npm install
      - name: Capacitor build
        script: |
          npm run build
          npx cap sync ios
      - name: Build iOS App
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - gabricci95@gmail.com # The user's email from GitHub
        notify:
          success: true
          failure: true
