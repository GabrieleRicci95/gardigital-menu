workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Apple Build"
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.gardigital.menu"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          # 1. Generate a new private key locally
          openssl genrsa -out /tmp/cert_key.p8 2048
          # 2. Unified command to Create Certificate + Create Profile + Save to Keychain
          app-store-connect fetch-signing-files --type IOS_APP_STORE --create --certificate-key "@file:/tmp/cert_key.p8" "$BUNDLE_ID"
          # 3. LINK the profiles and save the plist to the root
          xcode-project use-profiles
          cp /Users/builder/export_options.plist ./export_options.plist
          # 4. DISCOVERY: See how to pass variables to build
          xcode-project build-ipa --help
      - name: Install dependencies
        script: |
          npm install
      - name: Capacitor build
        script: |
          npm run build
          npx cap sync ios
      - name: Build iOS App
        script: |
          # 1. ROBUST PRECISION EXTRACTION (Targeting the Codemagic Keychain)
          MP_FILE=$(ls /Users/builder/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          security cms -D -i "$MP_FILE" > /tmp/decoded.plist
          
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/decoded.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/decoded.plist)
          
          # DIAGNOSTIC: List all identities in the specific Codemagic keychain
          echo "Listing all identities in Codemagic keychain ($CM_KEYCHAIN_PATH):"
          security find-identity -v -p codesigning "$CM_KEYCHAIN_PATH"
          
          # Extract ANY 'Distribution' identity from the local keychain
          ID_LINE=$(security find-identity -v -p codesigning "$CM_KEYCHAIN_PATH" | grep "Distribution" | head -n 1)
          if [ -z "$ID_LINE" ]; then
            echo "WARNING: No 'Distribution' identity found in local keychain. Checking default system search..."
            ID_LINE=$(security find-identity -v -p codesigning | grep "Distribution" | head -n 1)
          fi
          
          CERT_HASH=$(echo "$ID_LINE" | awk '{print $2}')
          CERT_IDENTITY=$(echo "$ID_LINE" | sed -E 's/.*"([^"]+)".*/\1/')
          
          echo "--- FINAL ROBUST DATA ---"
          echo "Profile Name: |$PROFILE_NAME|"
          echo "Profile UUID: |$PROFILE_UUID|"
          echo "Cert Hash   : |$CERT_HASH|"
          echo "Cert Name   : |$CERT_IDENTITY|"
          echo "--------------------------"
          
          if [ -z "$CERT_HASH" ]; then
            echo "ERROR: STILL NO CERTIFICATE! This means 'fetch-signing-files' didn't import it."
            exit 1
          fi
          
          # 2. RAW ARCHIVE (Proven Success)
          mkdir -p build/ios/xcarchive
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath $(pwd)/build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            PROVISIONING_PROFILE=$PROFILE_UUID \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM=33VT7NT5X9 \
            CODE_SIGN_IDENTITY="$CERT_HASH" \
            CODE_SIGN_STYLE=Manual
          
          # 3. MANUAL EXPORT PLIST (Using the Hash)
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>33VT7NT5X9</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$CERT_HASH</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          # 4. RAW EXPORT
          xcodebuild -exportArchive \
            -archivePath $(pwd)/build/ios/xcarchive/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath $(pwd)/build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - gabricci95@gmail.com # The user's email from GitHub
        notify:
          success: true
          failure: true
