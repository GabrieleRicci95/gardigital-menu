workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Apple Build"
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.gardigital.menu"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          # 1. Generate a new private key locally
          openssl genrsa -out /tmp/cert_key.p8 2048
          # 2. Unified command to Create Certificate + Create Profile + Save to Keychain
          app-store-connect fetch-signing-files --type IOS_APP_STORE --create --certificate-key "@file:/tmp/cert_key.p8" "$BUNDLE_ID"
          # 3. LINK the profiles and save the plist to the root
          xcode-project use-profiles
          cp /Users/builder/export_options.plist ./export_options.plist
          # 4. DISCOVERY: See how to pass variables to build
          xcode-project build-ipa --help
      - name: Install dependencies
        script: |
          npm install
      - name: Capacitor build
        script: |
          npm run build
          npx cap sync ios
      - name: Build iOS App
        script: |
          # 1. Extract the profile name
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :provisioningProfiles:$BUNDLE_ID" /Users/builder/export_options.plist)
          echo "Using Profile: $PROFILE_NAME"
          
          # 2. CREATE A NUCLEAR CONFIG FILE (XCConfig)
          # This overrides everything inside the project file without risk of syntax errors.
          cat > signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          DEVELOPMENT_TEAM = 33VT7NT5X9
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF
          
          echo "--- Generated XCConfig ---"
          cat signing.xcconfig
          echo "--------------------------"
          
          # 3. Build the IPA using the XCConfig override
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-xcargs "-xcconfig $(pwd)/signing.xcconfig"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - gabricci95@gmail.com # The user's email from GitHub
        notify:
          success: true
          failure: true
