workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Apple Build"
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.gardigital.menu"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          # 1. Generate a new private key locally
          openssl genrsa -out /tmp/cert_key.p8 2048
          # 2. Unified command to Create Certificate + Create Profile + Save to Keychain
          app-store-connect fetch-signing-files --type IOS_APP_STORE --create --certificate-key "@file:/tmp/cert_key.p8" "$BUNDLE_ID"
          # 3. LINK the profiles and save the plist to the root
          xcode-project use-profiles
          cp /Users/builder/export_options.plist ./export_options.plist
          # 4. DISCOVERY: See how to pass variables to build
          xcode-project build-ipa --help
      - name: Install dependencies
        script: |
          npm install
      - name: Capacitor build
        script: |
          npm run build
          npx cap sync ios
      - name: Build iOS App
        script: |
          # 1. EXTRACT FROM SOURCE OF TRUTH (.mobileprovision)
          # This is the most robust way to get data that actually exists and worked for Archive
          MP_FILE=$(ls /Users/builder/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          PROFILE_NAME=$(grep -a -A1 "Name" "$MP_FILE" | grep string | sed 's/<[^>]*>//g' | xargs)
          PROFILE_UUID=$(grep -a -A1 "UUID" "$MP_FILE" | grep string | sed 's/<[^>]*>//g' | xargs)
          CERT_IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Distribution" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          
          echo "--- SOURCE OF TRUTH ---"
          echo "File: $MP_FILE"
          echo "Name: |$PROFILE_NAME|"
          echo "UUID: |$PROFILE_UUID|"
          echo "Cert: |$CERT_IDENTITY|"
          echo "-----------------------"
          
          # 2. RAW ARCHIVE (Already proven to work)
          mkdir -p build/ios/xcarchive
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath $(pwd)/build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            PROVISIONING_PROFILE=$PROFILE_UUID \
            DEVELOPMENT_TEAM=33VT7NT5X9 \
            CODE_SIGN_IDENTITY="$CERT_IDENTITY" \
            CODE_SIGN_STYLE=Manual
          
          # 3. MANUAL EXPORT PLIST (Using Source of Truth)
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>33VT7NT5X9</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$CERT_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          # 4. RAW EXPORT: Create the IPA
          xcodebuild -exportArchive \
            -archivePath $(pwd)/build/ios/xcarchive/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath $(pwd)/build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - gabricci95@gmail.com # The user's email from GitHub
        notify:
          success: true
          failure: true
