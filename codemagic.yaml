workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_ID: "com.gardigital.menu"
        DEVELOPMENT_TEAM: "33VT7NT5X9"
      node: latest
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: "Apple Build"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Patch Xcode Project
        script: |
          # Set Team ID and Manual signing style directly in the project file
          sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$XCODE_PROJECT/project.pbxproj"
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.gardigital.menu;/PRODUCT_BUNDLE_IDENTIFIER = com.gardigital.menu; DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM;/g" "$XCODE_PROJECT/project.pbxproj"
      - name: Capacitor build
        script: |
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS App
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - gabricci95@gmail.com # The user's email from GitHub
        notify:
          success: true
          failure: true
