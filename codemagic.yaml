workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Apple Build"
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.gardigital.menu"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Capacitor build
        script: |
          npm run build
          npx cap sync ios
      - name: Build and Sign (Plan AAA)
        script: |
          # 1. ATOMIC SIGNING SETUP
          keychain initialize
          
          # Generate a fresh private key for THIS session
          openssl genrsa -out /tmp/cert_key.p8 2048
          
          # Force create new certificates/profiles (User has cleaned the portal)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "@file:/tmp/cert_key.p8"
          
          keychain add-certificates
          xcode-project use-profiles
          
          # 2. PROVISIONING INFO EXTRACTION (Fail-safe)
          MP_FILE=$(ls /Users/builder/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          if [ -z "$MP_FILE" ]; then
            echo "ERROR: No mobileprovision file found. Apple Portal might be empty or API key failed."
            exit 1
          fi
          
          security cms -D -i "$MP_FILE" > /tmp/decoded.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/decoded.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/decoded.plist)
          
          # Detect Identity from Keychain
          if [ -z "$CM_KEYCHAIN_PATH" ]; then
            CM_KEYCHAIN_PATH=$(find /Users/builder/Library -name "*.keychain-db" | grep "codemagic" | head -n 1)
          fi
          ID_LINE=$(security find-identity -v -p codesigning "$CM_KEYCHAIN_PATH" 2>/dev/null | grep "Distribution" | head -n 1)
          CERT_HASH=$(echo "$ID_LINE" | awk '{print $2}')
          
          echo "--- ATOMIC DATA VERIFIED ---"
          echo "Profile: |$PROFILE_NAME| ($PROFILE_UUID)"
          echo "Cert Hash: |$CERT_HASH|"
          
          if [ -z "$CERT_HASH" ] || [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: Missing critical signing data. Check logs above."
            exit 1
          fi
          
          # 3. BUILD ARCHIVE
          mkdir -p build/ios/xcarchive
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$(pwd)/build/ios/xcarchive/App.xcarchive" \
            -allowProvisioningUpdates \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM=33VT7NT5X9 \
            CODE_SIGN_IDENTITY="$CERT_HASH" \
            CODE_SIGN_STYLE=Manual
          
          # 4. EXPORT IPA
          # Generate export options on the fly
          cat > /tmp/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>33VT7NT5X9</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$CERT_HASH</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath "$(pwd)/build/ios/xcarchive/App.xcarchive" \
            -exportOptionsPlist /tmp/export_options.plist \
            -exportPath "$(pwd)/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - gabricci95@gmail.com
        notify:
          success: true
          failure: true
