workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Apple Build"
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.gardigital.menu"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Capacitor build
        script: |
          npm run build
          npx cap sync ios
      - name: Build iOS App
        script: |
          # 1. ROBUST SIGNING HANDSHAKE (Plan ZU)
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          
          # MANUAL PATH SEARCH (The GPS fix)
          if [ -z "$CM_KEYCHAIN_PATH" ]; then
            echo "CM_KEYCHAIN_PATH is empty. Searching filesystem..."
            export CM_KEYCHAIN_PATH=$(find /Users/builder/Library -name "*.keychain-db" | grep "codemagic" | head -n 1)
          fi
          echo "Found Keychain Path: |$CM_KEYCHAIN_PATH|"
          
          # Extraction of Provisioning Info
          MP_FILE=$(ls /Users/builder/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          security cms -D -i "$MP_FILE" > /tmp/decoded.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/decoded.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/decoded.plist)
          
          # SEARCH IDENTITIES
          echo "Listing all identities (global):"
          security find-identity -v -p codesigning
          
          echo "Listing all identities in detected keychain:"
          security find-identity -v -p codesigning "$CM_KEYCHAIN_PATH" 2>/dev/null
          
          # Try to get the hash from ANY valid distribution identity
          ID_LINE=$(security find-identity -v -p codesigning "$CM_KEYCHAIN_PATH" 2>/dev/null | grep "Distribution" | head -n 1)
          if [ -z "$ID_LINE" ]; then
             echo "Identity not found in CM keychain, searching globally..."
             ID_LINE=$(security find-identity -v -p codesigning | grep "Distribution" | head -n 1)
          fi
          
          CERT_HASH=$(echo "$ID_LINE" | awk '{print $2}')
          CERT_IDENTITY=$(echo "$ID_LINE" | sed -E 's/.*"([^"]+)".*/\1/')
          
          echo "--- FINAL HANDSHAKE DATA ---"
          echo "Profile Name: |$PROFILE_NAME|"
          echo "Profile UUID: |$PROFILE_UUID|"
          echo "Cert Hash   : |$CERT_HASH|"
          echo "Cert Name   : |$CERT_IDENTITY|"
          echo "----------------------------"
          
          if [ -z "$CERT_HASH" ]; then
            echo "ERROR: CERTIFICATE NOT FOUND. Check portal if any Distribution cert exists."
            exit 1
          fi
          
          # 2. RAW ARCHIVE (Proven Success)
          mkdir -p build/ios/xcarchive
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath $(pwd)/build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            PROVISIONING_PROFILE=$PROFILE_UUID \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM=33VT7NT5X9 \
            CODE_SIGN_IDENTITY="$CERT_HASH" \
            CODE_SIGN_STYLE=Manual
          
          # 3. MANUAL EXPORT PLIST (Using the Hash)
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>33VT7NT5X9</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$CERT_HASH</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          # 4. RAW EXPORT
          xcodebuild -exportArchive \
            -archivePath $(pwd)/build/ios/xcarchive/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath $(pwd)/build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - gabricci95@gmail.com
        notify:
          success: true
          failure: true
